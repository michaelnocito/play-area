<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ODD SOCK — Free-Fall Prototype</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { position:fixed; inset:0; height:100%; width:100%; background:#0d0b09; overflow:hidden; touch-action:none;
              font-family:system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#0d0b09; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* ============================================================================
   ODD SOCK — "THE FREE FALL" prototype (🔷 Mike 2026-07-24: core-verb rebuild)
   The rim-orbit dodger is retired here. NEW core verb: the sock is a FREE-FALLING
   BODY plunging down the dryer shaft. It IS its own parachute — the open cuff
   catches air, so it floats at a slow terminal velocity and drifts pendularly.
   You NUDGE left/right to swing it toward the gap in each garment ring, and you
   can TUCK (dive) to collapse the canopy and plummet fast for greed/speed.

   Two axes, both real physics:
     FALL   gravity accelerates the plunge · air-drag ∝ v² balances it into a
            floaty terminal velocity · TUCK shrinks the canopy area → higher
            terminal velocity → you fall FAST (risk). Release → canopy re-inflates,
            you decelerate and float again (the parachute fighting gravity).
     DRIFT  nudges apply angular acceleration · air-drag bleeds it off floatily ·
            the body swings under the caught air (pendular overshoot, then settle).

   Dodge space is kept 1-D angular (nudge to the ring's gap) so a gap-seeking bot
   fairness harness is re-derivable — same pattern as the drum harness.
   Isolated FEEL-GATE only. If it feels right, it replaces the drum core.

   Controls: ←→ / A D = nudge · hold SPACE / ↓ = DIVE (tuck & plummet) ·
             touch: hold left/right third = nudge · hold centre = DIVE.
   ============================================================================ */
const VW=480, VH=270, TAU=6.28318530718;
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let scale=1;
function resize(){ const w=innerWidth||1,h=innerHeight||1; scale=Math.min(w/VW,h/VH);
  const dpr=devicePixelRatio||1;
  cv.width=VW*dpr*scale|0; cv.height=VH*dpr*scale|0;
  cv.style.width=VW*scale+"px"; cv.style.height=VH*scale+"px";
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0); }
addEventListener("resize",resize); resize();

/* ===== Geometry ===== */
const CX=240, CY=135, RIM=116;         // shaft centre + rim radius at the camera plane
const PERSP=1.9;                       // r = RIM * z^PERSP — depth ease (z: 0 deep → 1 at the rim)
const SOCK_R=0.90;                     // the sock falls near the shaft wall (dodge = angular)
const HITLO=0.90, HITHI=1.02;          // z window where a garment ring is "level with the sock"

/* ===== FALL physics (parachute vs gravity) ===== */
const G=1.35;                          // gravity pull on the plunge (z-units/s²)
const DRAG_OPEN=7.2;                   // canopy-open air drag coeff (∝ v²) → low, floaty terminal V
const DRAG_TUCK=1.15;                  // tucked drag → high terminal V (plummet)
const CANOPY_RESP=6.0;                 // how fast the canopy inflates/collapses (area lerp /s)
const FALLV_MIN=0.30;                  // never fully stall — always drifting down "through"
/* terminal velocity solves G = DRAG*v²  →  v = sqrt(G/DRAG):
   open  ≈ sqrt(1.35/7.2) ≈ 0.43 z/s  (floaty)
   tuck  ≈ sqrt(1.35/1.15)≈ 1.08 z/s  (fast plunge) */

/* ===== DRIFT physics (pendular parachute steering) ===== */
const NUDGE_ACC=15.0;                  // angular acceleration from a held nudge (rad/s²)
const AV_MAX=3.2;                      // clamp on angular velocity
const LAT_DRAG=2.4;                    // air-drag bleed on angular velocity (/s) — the floaty settle
const SWAY_SPRING=42, SWAY_DAMP=7.0;   // visual pendulum: body swings under the caught air

/* ===== Run ===== */
const RING_GAP0=0.66, RING_GAPMIN=0.44;// angular half-width of a ring's safe gap (eases down w/ depth)
const RING_SPACING=0.46;               // z-gap between spawned rings (in z-units of travel)
const GAP_WANDER=1.15;                  // max rad the gap moves between consecutive rings (reachable at float speed)
const DEPTH_GOAL=26;                   // total z-units of fall to THE LOST SOCK VORTEX
const HP_MAX=3;

/* ===== Audio (trimmed from the main Snd) ===== */
const Snd={ctx:null,g:null,wind:null,windG:null,
  ensure(){ if(this.ctx)return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.g=this.ctx.createGain(); this.g.gain.value=0.8; this.g.connect(this.ctx.destination);
    // dryer rumble bed
    const n=this.ctx.sampleRate/2|0, b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=b; s.loop=true;
    const lp=this.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=90;
    const g2=this.ctx.createGain(); g2.gain.value=0.07; s.connect(lp); lp.connect(g2); g2.connect(this.g); s.start();
    // wind layer — swells with fall speed (the plunge)
    const wb=this.ctx.createBuffer(1,n,this.ctx.sampleRate), wd=wb.getChannelData(0);
    for(let i=0;i<n;i++)wd[i]=Math.random()*2-1;
    this.wind=this.ctx.createBufferSource(); this.wind.buffer=wb; this.wind.loop=true;
    const bp=this.ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=620; bp.Q.value=0.7;
    this.windG=this.ctx.createGain(); this.windG.gain.value=0.0;
    this.wind.connect(bp); bp.connect(this.windG); this.windG.connect(this.g); this.wind.start();
  }catch(e){} },
  windLevel(v){ if(this.windG) this.windG.gain.value=v; },
  b(f1,f2,dur,type,vol){ if(!this.ctx)return; const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.g); o.start(t); o.stop(t+dur+0.03); },
  puff(){ this.b(260,120,0.14,"triangle",0.08); },                 // canopy re-inflates
  dive(){ this.b(180,520,0.18,"sawtooth",0.09); },                 // tuck & plummet
  thru(){ this.b(420,640,0.10,"triangle",0.09); },                 // clean fall through a ring
  graze(){ this.b(1500,2100,0.05,"triangle",0.05); },
  coin(){ const f=2000+Math.random()*360; this.b(f,f*0.92,0.035,"square",0.05); this.b(f*1.35,f*1.25,0.05,"triangle",0.06); },
  hurt(){ this.b(220,50,0.3,"sawtooth",0.16); },
  die(){ this.b(200,36,0.45,"sawtooth",0.18); },
  win(){ this.b(440,660,0.4,"triangle",0.12); this.b(660,990,0.5,"triangle",0.1); },
  thump(v){ this.b(85,42,0.11,"sine",v||0.09); }
};

/* ===== Sock sprite (from the main game) ===== */
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
let SOCK=null;
{ const W=128, r=48, c=mkCanvas(W,W), x=c.getContext("2d");
  x.translate(W/2,W/2);
  const path=()=>{ x.beginPath();
    x.moveTo(-1.05*r,-1.0*r); x.lineTo(-0.05*r,-1.0*r);
    x.lineTo(-0.05*r,0.02*r); x.quadraticCurveTo(-0.05*r,0.2*r,0.18*r,0.2*r);
    x.lineTo(0.72*r,0.2*r); x.quadraticCurveTo(1.14*r,0.24*r,1.08*r,0.64*r);
    x.lineTo(0.96*r,1.0*r); x.lineTo(-0.72*r,1.0*r);
    x.quadraticCurveTo(-1.1*r,1.0*r,-1.05*r,0.5*r); x.closePath(); };
  path(); x.fillStyle="#efe9db"; x.fill();
  x.save(); path(); x.clip();
  x.fillStyle="rgba(0,0,0,0.05)"; for(let yy=-r;yy<r;yy+=7) x.fillRect(-1.2*r,yy,2.4*r,2);
  x.fillStyle="rgba(0,0,0,0.18)";
  x.beginPath(); x.arc(-0.72*r,0.78*r,0.42*r,0,TAU); x.fill();
  x.beginPath(); x.arc(1.0*r,0.75*r,0.42*r,0,TAU); x.fill();
  x.fillStyle="rgba(255,255,255,0.45)"; x.fillRect(-1.05*r,-1.0*r,1.0*r,0.2*r);
  x.restore(); SOCK=c; }
function glowSprite(sz,r,g,b){ const c=mkCanvas(sz,sz),x=c.getContext("2d");
  const gr=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  gr.addColorStop(0,"rgba("+r+","+g+","+b+",1)"); gr.addColorStop(0.5,"rgba("+r+","+g+","+b+",0.55)");
  gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)"); x.fillStyle=gr; x.fillRect(0,0,sz,sz); return c; }
const VORTEX=glowSprite(160,190,150,255), WARM=glowSprite(128,255,190,110);

/* garment sprites (the rings ARE laundry) */
const PAL_HOT=[
  {body:"#ff4a63",rim:"#ffd0d6",dark:"#7d0f1f",fold:"#c21f38"},
  {body:"#ff7a3c",rim:"#ffe0c2",dark:"#8a2c08",fold:"#d4531f"},
  {body:"#ff4a8c",rim:"#ffd0e4",dark:"#7d0f3f",fold:"#c21f5e"},
  {body:"#f23030",rim:"#ffd6c8",dark:"#761010",fold:"#bf1d1d"}
];
function mkGarment(kind,pal){ const W=72,c=mkCanvas(W,W),x=c.getContext("2d"); x.translate(W/2,W/2);
  const body=pal.body, rim=pal.rim, dark=pal.dark, fold=pal.fold;
  function outline(fn){ x.save(); x.strokeStyle=dark; x.lineWidth=5; x.lineJoin="round"; fn(true); x.restore(); fn(false); }
  if(kind===0){ outline(o=>{ x.beginPath();
      x.moveTo(-13,-26); x.lineTo(13,-26);
      x.lineTo(30,-14); x.lineTo(22,0); x.lineTo(13,-6); x.lineTo(13,28);
      x.lineTo(-13,28); x.lineTo(-13,-6); x.lineTo(-22,0); x.lineTo(-30,-14);
      x.closePath(); if(o){x.stroke();return;} x.fillStyle=body; x.fill(); });
    x.fillStyle=dark; x.beginPath(); x.arc(0,-26,8,0,Math.PI); x.fill();
    x.fillStyle=fold; x.fillRect(-13,8,26,3); x.fillRect(-13,18,26,3);
    x.fillStyle=rim; x.fillRect(-13,25,26,3); }
  else if(kind===1){ outline(o=>{ x.beginPath();
      x.moveTo(-16,-28); x.lineTo(16,-28); x.lineTo(16,-12);
      x.lineTo(14,30); x.lineTo(3,30); x.lineTo(0,-2); x.lineTo(-3,30); x.lineTo(-14,30); x.lineTo(-16,-12);
      x.closePath(); if(o){x.stroke();return;} x.fillStyle=body; x.fill(); });
    x.fillStyle=dark; x.fillRect(-16,-28,32,5);
    x.fillStyle=fold; x.fillRect(-11,0,5,24); x.fillRect(6,0,5,24);
    x.fillStyle=rim; x.fillRect(-14,27,11,3); x.fillRect(3,27,11,3); }
  else { outline(o=>{ x.beginPath();
      x.moveTo(-15,-28); x.lineTo(15,-24); x.lineTo(13,28); x.lineTo(-17,24);
      x.closePath(); if(o){x.stroke();return;} x.fillStyle=body; x.fill(); });
    x.fillStyle=fold; x.fillRect(-14,-12,28,4); x.fillRect(-15,4,28,4);
    x.fillStyle=rim; x.fillRect(-16,21,28,3); x.fillRect(-15,-28,30,3); }
  return c; }
const GARM_HOT=[]; for(let k=0;k<3;k++) for(let p=0;p<PAL_HOT.length;p++) GARM_HOT.push(mkGarment(k,PAL_HOT[p]));

/* ===== State ===== */
let mode="ready";                       // ready | play | dead | win
let a=Math.PI/2;                        // sock angular position on the wall
let av=0;                               // angular velocity (drifts w/ drag)
let sway=0, swayV=0;                    // visual pendulum offset
let fallV=FALLV_MIN;                    // current plunge speed (z/s)
let canopy=1;                           // canopy area 1=open(float) → 0=tucked(plummet)
let depth=0, best=0, t=0, hp=HP_MAX;
let shake=0, flash=0, camBob=0, coinsRun=0, thruCount=0;
let hitStop=0, graceT=0, billow=0;
const keys={}, touches={};
let diveHold=false;

const RINGS=48, rings=[];               // garment rings falling toward the sock
for(let i=0;i<RINGS;i++) rings.push({on:false,z:0,gap:0,hw:RING_GAP0,gi:0,scored:false});
const COINS=40, coins=[];
for(let i=0;i<COINS;i++) coins.push({on:false,z:0,ang:0,val:1});
const dust=[]; for(let i=0;i<40;i++) dust.push({on:false,x:0,y:0,vx:0,vy:0,life:0});

let nextRingZ=0, ringSeq=0, spinBase=0.18, drumRot=0;

function angDiff(x,y){ let d=(x-y)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
function spawnDust(px,py,n,col){ for(let k=0;k<n;k++){ const d=dust.find(q=>!q.on); if(!d)return;
  const an=Math.random()*TAU, sp=20+Math.random()*40;
  d.on=true; d.x=px; d.y=py; d.vx=Math.cos(an)*sp; d.vy=Math.sin(an)*sp; d.life=0.4+Math.random()*0.3; d.col=col||"#d8cdb6"; } }

function reset(){ a=Math.PI/2; av=0; sway=0; swayV=0; fallV=FALLV_MIN; canopy=1;
  depth=0; hp=HP_MAX; t=0; shake=0; flash=0; camBob=0; coinsRun=0; thruCount=0; hitStop=0; graceT=1.2; billow=0;
  for(const r of rings) r.on=false; for(const c of coins) c.on=false; for(const d of dust) d.on=false;
  nextRingZ=1.6; ringSeq=0; drumRot=0; }

/* ===== Ring / coin spawning — rings ride up from deep at fallV, sock falls THROUGH the gap ===== */
function spawnRing(){ const r=rings.find(q=>!q.on); if(!r)return;
  const prog=depth/DEPTH_GOAL;
  const ramp=clamp(ringSeq/16,0,1);                            // first ~16 rings teach: wide + gentle → full difficulty
  r.on=true; r.z=0.05; r.scored=false;
  r.hw=RING_GAP0-(RING_GAP0-RING_GAPMIN)*Math.min(1,prog)*ramp;// gap tightens as you near the vortex (eased in)
  // gap wanders a fair, reachable amount from the last one (no teleport-across)
  r.gap=(ringSeq===0)? a : (rings.find(q=>q.on&&q!==r&&q.z>0.6)?.gap ?? a);
  r.gap=(r.gap + (Math.random()*2-1)*GAP_WANDER*(0.35+0.65*ramp) + TAU)%TAU;
  r.gi=(Math.random()*GARM_HOT.length)|0;
  ringSeq++;
  // maybe hang some loose change near the gap edge (greed line = the safe line, Downwell)
  if(Math.random()<0.7){ const c=coins.find(q=>!q.on); if(c){ c.on=true; c.z=0.05;
    c.ang=(r.gap + (Math.random()*2-1)*r.hw*0.8 + TAU)%TAU; c.val=Math.random()<0.25?5:1; } } }

/* ===== Fairness bot (?bot=1) — gap-seeker w/ reaction delay; never touches a real save =====
   samples the nearest un-passed ring, nudges toward its gap, tucks only when lined up. */
const BOT=/[?&]bot=/.test(location.search);
const BOT_DELAY=0.08;                         // reaction lag (s) — human-ish; set 0 to test raw solvability
let botHold=0, botCmd=0;
function botDrive(dt){ keys.ArrowLeft=keys.ArrowRight=false; diveHold=false;
  // imminent un-passed ring = the highest-z ring still short of the sock plane
  let tgt=null, bz=-1;
  for(const r of rings){ if(r.on && !r.scored && r.z<HITHI && r.z>bz){ tgt=r; bz=r.z; } }
  if(!tgt) return;
  // PD controller: because drift has momentum + drag, a survival bot must BRAKE before the
  // gap (null the error d AND the angular velocity av) or it overshoots and clips the hem.
  botHold-=dt;
  if(botHold<=0){ const d=angDiff(tgt.gap,a); botCmd=6.0*d - 1.1*av; botHold=BOT_DELAY; }
  if(botCmd>0.18) keys.ArrowRight=true; else if(botCmd<-0.18) keys.ArrowLeft=true;
  // pure SURVIVAL bot: never dives (greed is the player's optional risk) — float-only, so the
  // test is strictly "is every ring's gap reachable?"
}

/* ===== Input ===== */
addEventListener("keydown",e=>{ const k=e.key;
  if(k===" "||k==="ArrowDown"||k==="s"||k==="S") diveHold=true;
  keys[k]=true;
  if((k===" "||k==="Enter")&&mode!=="play"){ Snd.ensure(); if(mode==="ready"||mode==="win"){ reset(); mode="play"; } else if(mode==="dead"&&t>0.4){ reset(); mode="play"; } }
  if(k===" "||k==="ArrowDown"||k==="ArrowUp"||k==="ArrowLeft"||k==="ArrowRight") e.preventDefault();
});
addEventListener("keyup",e=>{ const k=e.key; keys[k]=false; if(k===" "||k==="ArrowDown"||k==="s"||k==="S") diveHold=false; });
function tpos(t){ const rc=cv.getBoundingClientRect(); return (t.clientX-rc.left)/rc.width; }
addEventListener("touchstart",e=>{ Snd.ensure(); if(mode!=="play"){ if(mode==="ready"||mode==="win"||(mode==="dead"&&t>0.4)){ reset(); mode="play"; } e.preventDefault(); return; }
  for(const tc of e.changedTouches) touches[tc.identifier]={x:tpos(tc)}; e.preventDefault(); },{passive:false});
addEventListener("touchmove",e=>{ for(const tc of e.changedTouches) if(touches[tc.identifier]) touches[tc.identifier].x=tpos(tc); e.preventDefault(); },{passive:false});
addEventListener("touchend",e=>{ for(const tc of e.changedTouches) delete touches[tc.identifier]; e.preventDefault(); },{passive:false});

/* ===== Update ===== */
function update(dt){
  t+=dt;
  if(mode!=="play"){ Snd.windLevel(0); return; }
  if(BOT) botDrive(dt);
  if(hitStop>0){ hitStop-=dt; return; }

  // ---- resolve nudge input ----
  let nudge=0;
  if(keys.ArrowLeft||keys.a||keys.A||keys.q||keys.Q) nudge-=1;
  if(keys.ArrowRight||keys.d||keys.D) nudge+=1;
  let tDive=false;
  for(const id in touches){ const x=touches[id].x;
    if(x<0.34) nudge-=1; else if(x>0.66) nudge+=1; else tDive=true; }
  const diving=(diveHold||tDive);

  // ---- FALL: canopy area lerps, terminal velocity from drag, gravity accelerates ----
  const targetCanopy=diving?0:1;
  canopy+=(targetCanopy-canopy)*Math.min(1,CANOPY_RESP*dt);
  const drag=DRAG_TUCK+(DRAG_OPEN-DRAG_TUCK)*canopy;      // open→high drag(float), tuck→low drag(plummet)
  fallV+=(G - drag*fallV*fallV)*dt;                       // gravity vs quadratic air drag
  if(fallV<FALLV_MIN) fallV=FALLV_MIN;
  billow=canopy*(0.6+0.4*Math.sin(t*7));                  // cloth catch flutter
  if(diving && canopy>0.5) Snd.dive();
  if(!diving && canopy<0.6 && canopy>0.55) Snd.puff();

  // ---- DRIFT: pendular parachute steering ----
  av+=nudge*NUDGE_ACC*dt;
  av-=av*Math.min(1,LAT_DRAG*dt);                         // air drag bleed → floaty settle
  av=clamp(av,-AV_MAX,AV_MAX);
  a=(a+av*dt+TAU)%TAU;
  // visual pendulum: the body swings under the caught air (more sway when the canopy is full)
  const swayTarget=-av*0.10*canopy;
  swayV+=((swayTarget-sway)*SWAY_SPRING - swayV*SWAY_DAMP)*dt; sway+=swayV*dt;

  // ---- world falls past: rings & coins rise in z at fallV; drum tumble ----
  drumRot+=spinBase*dt*(1+fallV*0.4);
  depth+=fallV*dt;
  nextRingZ-=fallV*dt;
  if(nextRingZ<=0){ spawnRing(); nextRingZ=RING_SPACING; }

  if(graceT>0) graceT-=dt;
  Snd.windLevel(clamp((fallV-0.35)*0.12,0,0.10));         // wind swells with the plunge
  camBob=Math.sin(t*10)*fallV*0.9;

  // ---- rings: advance, collide/score at the sock's plane ----
  for(const r of rings){ if(!r.on) continue; r.z+=fallV*dt;
    if(!r.scored && r.z>=HITLO){
      const miss=Math.abs(angDiff(a,r.gap));
      if(r.z<=HITHI){
        if(miss<=r.hw){ /* threading — clean fall through */ }
        else if(miss<=r.hw+0.14){ // GRAZE the hot hem
          if(graceT<=0){ Snd.graze(); const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R; spawnDust(px,py,3,"#ffb0a0"); } }
        else { // SCORCH
          if(graceT<=0){ r.scored=true; hp--; hitStop=0.09; shake=8; flash=0.7; graceT=1.1; Snd.hurt();
            const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R; spawnDust(px,py,10,"#ff7a5a");
            if(hp<=0){ mode="dead"; t=0; Snd.die(); best=Math.max(best,depth); } }
        }
      }
    }
    if(r.z>HITHI && !r.scored){ r.scored=true; thruCount++; Snd.thru(); }   // fell clean through
    if(r.z>1.35) r.on=false;
  }
  // ---- coins ----
  for(const c of coins){ if(!c.on) continue; c.z+=fallV*dt;
    if(c.z>0.9 && c.z<1.06 && Math.abs(angDiff(a,c.ang))<0.28){ c.on=false; coinsRun+=c.val; Snd.coin();
      const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R; spawnDust(px,py,4,"#ffd45a"); }
    else if(c.z>1.2) c.on=false; }
  // ---- dust ----
  for(const d of dust){ if(!d.on) continue; d.life-=dt; if(d.life<=0){ d.on=false; continue; }
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=60*dt; }

  if(shake>0) shake=Math.max(0,shake-dt*22);
  if(flash>0) flash=Math.max(0,flash-dt*2.2);

  // ---- reached THE LOST SOCK VORTEX ----
  if(depth>=DEPTH_GOAL){ mode="win"; t=0; best=Math.max(best,depth); Snd.win(); }
}

/* ===== Render ===== */
function txt(s,x,y,sz,col,w){ ctx.fillStyle=col||"#fff"; ctx.font=(w||600)+" "+sz+"px system-ui,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }

function draw(){
  const ox=(Math.random()-0.5)*shake, oy=(Math.random()-0.5)*shake + camBob;
  ctx.save(); ctx.translate(ox,oy);
  ctx.fillStyle="#100c09"; ctx.fillRect(-12,-12,VW+24,VH+24);
  ctx.imageSmoothingEnabled=false;

  const prog=Math.min(1,depth/DEPTH_GOAL);

  // shaft wall — receding rings (the tube you're falling down), tumbling
  for(let ring=6;ring>=1;ring--){ const z=ring/6.4, r=RIM*Math.pow(z,PERSP);
    ctx.strokeStyle="rgba(120,86,54,"+(0.08+z*0.20)+")"; ctx.lineWidth=1.2+z*2;
    ctx.beginPath(); ctx.arc(CX,CY,r,0,TAU); ctx.stroke();
    const n=10+ring*4;
    ctx.fillStyle="rgba(255,190,110,"+(0.04+z*0.09)+")";
    for(let k=0;k<n;k++){ const an=drumRot*(0.4+z)+k*TAU/n;
      ctx.fillRect(CX+Math.cos(an)*r-1,CY+Math.sin(an)*r-1,2,2); } }

  // WIND STREAKS — the plunge read: lines stream outward from the vortex toward the camera,
  // longer & denser the faster you fall (esp. when tucked/diving)
  { const nS=8+Math.floor(fallV*20); ctx.strokeStyle="rgba(210,180,255,"+(0.05+fallV*0.10)+")"; ctx.lineWidth=1;
    for(let k=0;k<nS;k++){ const an=(k*2.399+t*0.3)%TAU;
      const zA=((t*fallV*0.9+k*0.137)%1);                    // travels 0→1 (deep→rim)
      const r0=RIM*Math.pow(zA*0.6,PERSP), r1=RIM*Math.pow(Math.min(1,zA*0.6+0.14),PERSP);
      ctx.beginPath(); ctx.moveTo(CX+Math.cos(an)*r0,CY+Math.sin(an)*r0);
      ctx.lineTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1); ctx.stroke(); } }

  // THE LOST SOCK VORTEX far below — grows as you near it
  { const vs=22+prog*76+Math.sin(t*2.2)*3;
    ctx.globalAlpha=0.5+prog*0.5; ctx.drawImage(VORTEX,CX-vs,CY-vs,vs*2,vs*2); ctx.globalAlpha=1;
    ctx.strokeStyle="rgba(210,180,255,"+(0.3+prog*0.4)+")"; ctx.lineWidth=2;
    for(let s2=0;s2<3;s2++){ ctx.beginPath(); ctx.arc(CX,CY,6+s2*7+prog*10,-t*2.4+s2*2.1,-t*2.4+s2*2.1+2.4); ctx.stroke(); } }
  // your pair, glimpsed spiralling in the vortex (the reason for the fall)
  { const pa=-t*1.7, prr=8+prog*7, ps=5+prog*6, ppx=CX+Math.cos(pa)*prr, ppy=CY+Math.sin(pa)*prr;
    ctx.globalAlpha=0.5+0.25*Math.sin(t*3); ctx.drawImage(WARM,ppx-ps,ppy-ps,ps*2,ps*2);
    ctx.imageSmoothingEnabled=true; ctx.save(); ctx.translate(ppx,ppy); ctx.rotate(pa+t*2.2);
    ctx.drawImage(SOCK,-ps/2,-ps/2,ps,ps); ctx.restore(); ctx.imageSmoothingEnabled=false; ctx.globalAlpha=1; }

  // rings far→near: a garment RING with a GAP you must fall through
  const order=rings.filter(r=>r.on).sort((p,q)=>p.z-q.z);
  ctx.imageSmoothingEnabled=true;
  for(const r of order){ const zz=Math.min(1.05,r.z), rr=RIM*Math.pow(Math.min(1,zz),PERSP);
    const fade=r.z>1?Math.max(0,1-(r.z-1)/0.3):Math.min(1,r.z*4);
    const near=r.z>0.75?(r.z-0.75)/0.25:0;
    // the hot ring everywhere EXCEPT the gap
    ctx.globalAlpha=(0.4+0.6*Math.min(1,zz))*fade;
    ctx.strokeStyle=near>0?"rgba(255,84,104,0.9)":"rgba(255,110,90,0.7)"; ctx.lineWidth=3+9*zz*zz;
    ctx.beginPath(); ctx.arc(CX,CY,rr,r.gap+r.hw,r.gap-r.hw+TAU); ctx.stroke();
    // heat haze as it nears the sock plane
    if(near>0){ ctx.strokeStyle="rgba(255,84,104,0.3)"; ctx.lineWidth=(3+9*zz*zz)+10;
      ctx.beginPath(); ctx.arc(CX,CY,rr,r.gap+r.hw,r.gap-r.hw+TAU); ctx.stroke(); }
    // garment shapes riding the ring (3 around the hot side)
    if(zz>0.3) for(let s=0;s<3;s++){ const an=r.gap+r.hw + (s+1)/4*(TAU-2*r.hw);
      const gs=Math.max(9,12*zz), gx=CX+Math.cos(an)*rr, gy=CY+Math.sin(an)*rr;
      ctx.save(); ctx.translate(gx,gy); ctx.rotate(an+Math.PI/2+Math.sin(t*3+s)*0.12);
      ctx.drawImage(GARM_HOT[(r.gi+s)%GARM_HOT.length],-gs/2,-gs/2,gs,gs); ctx.restore(); }
    // the SAFE GAP: a cool inviting opening (orientation — where to fall through)
    ctx.globalAlpha=(0.5+0.5*zz)*fade;
    ctx.strokeStyle="rgba(150,230,255,"+(0.5+0.4*near)+")"; ctx.lineWidth=2+2*zz;
    ctx.beginPath(); ctx.arc(CX,CY,rr,r.gap-r.hw,r.gap+r.hw); ctx.stroke();
    ctx.globalAlpha=1; }
  ctx.imageSmoothingEnabled=false;

  // coins
  for(const c of coins){ if(!c.on) continue; const zz=Math.min(1,c.z), r=RIM*Math.pow(zz,PERSP)*SOCK_R;
    const px=CX+Math.cos(c.ang)*r, py=CY+Math.sin(c.ang)*r, q=c.val>1, br=(2+4.5*zz)*(q?1.3:1);
    ctx.globalAlpha=0.35+0.65*zz;
    const tum=Math.abs(Math.sin(t*5+c.ang*7));
    ctx.save(); ctx.translate(px,py); ctx.rotate(c.ang+t*1.5); ctx.scale(Math.max(0.18,tum),1);
    ctx.fillStyle=q?"#dfe6ee":"#e0995c"; ctx.beginPath(); ctx.arc(0,0,br,0,TAU); ctx.fill();
    ctx.strokeStyle=q?"#8f9aa8":"#9c6234"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,br-0.8,0,TAU); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1; }

  // ===== THE SOCK — a free-falling parachute =====
  if(mode!=="dead"){
    const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R;
    // caught-air halo behind the sock, scaled by canopy (the parachute reading)
    const cs=(16+10*canopy)*(1+0.12*billow);
    ctx.globalAlpha=0.16+0.20*canopy; ctx.drawImage(WARM,px-cs,py-cs,cs*2,cs*2); ctx.globalAlpha=1;
    ctx.imageSmoothingEnabled=true; ctx.save(); ctx.translate(px,py);
    // orient the sock's mouth "up" toward the camera, add pendular sway + cloth billow stretch
    const face=Math.atan2(CY-py,CX-px)+Math.PI/2;
    ctx.rotate(face + sway);
    const stretchY=1+0.18*canopy*billow, stretchX=1-0.10*(1-canopy);   // open=billow wide, tuck=streamline
    ctx.scale(stretchX,stretchY);
    const ss=30; ctx.drawImage(SOCK,-ss/2,-ss*0.62,ss,ss);
    ctx.restore(); ctx.imageSmoothingEnabled=false;
    // shroud shimmer when the canopy is full
    if(canopy>0.6){ ctx.strokeStyle="rgba(180,240,255,"+(0.12*canopy)+")"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px,py,cs*0.7,0,TAU); ctx.stroke(); }
  }

  // dust
  for(const d of dust){ if(!d.on) continue; ctx.globalAlpha=Math.max(0,d.life*2.2);
    ctx.fillStyle=d.col; ctx.fillRect(d.x-1.5,d.y-1.5,3,3); } ctx.globalAlpha=1;

  // ===== HUD =====
  // depth-to-vortex bar (top)
  ctx.fillStyle="rgba(255,255,255,0.12)"; ctx.fillRect(60,12,VW-120,5);
  ctx.fillStyle="#c9b0ff"; ctx.fillRect(60,12,(VW-120)*prog,5);
  txt("↓ THE LOST SOCK VORTEX",CX,26,8,"rgba(220,200,255,0.8)",600);
  // HP hearts (sock patches)
  for(let i=0;i<HP_MAX;i++){ ctx.fillStyle=i<hp?"#9bf0d0":"rgba(255,255,255,0.14)"; ctx.fillRect(12+i*12,12,9,9); }
  // fall-speed / DIVE readout
  const fastP=clamp((fallV-0.4)/0.7,0,1);
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(VW-58,12,46,5);
  ctx.fillStyle=fastP>0.6?"#ff7a5a":"#ffd45a"; ctx.fillRect(VW-58,12,46*fastP,5);
  txt(canopy<0.5?"DIVE":"FLOAT",VW-35,26,7,canopy<0.5?"#ff9a7a":"#bfe4ff",700);
  if(coinsRun>0) txt(coinsRun+"¢",CX,VH-12,9,"#ffd45a",700);

  if(flash>0){ ctx.fillStyle="rgba(255,90,70,"+(flash*0.4)+")"; ctx.fillRect(-12,-12,VW+24,VH+24); }
  ctx.restore();

  // ===== overlays =====
  if(mode==="ready"){ ctx.fillStyle="rgba(10,8,6,0.72)"; ctx.fillRect(0,0,VW,VH);
    txt("ODD SOCK",CX,74,30,"#efe9db",800); txt("THE FREE FALL",CX,100,13,"#c9b0ff",700);
    txt("You are a sock, tumbling down the dryer shaft after your pair.",CX,132,9,"#d8cdb6",500);
    txt("←→ swing  ·  hold ↓/SPACE to DIVE & plummet",CX,150,9,"#d8cdb6",500);
    txt("float through the cool gap in each ring of hot laundry",CX,166,9,"#a89e88",500);
    txt("press SPACE / tap to fall",CX,196,11,"#9bf0d0",700); }
  else if(mode==="dead"){ ctx.fillStyle="rgba(30,8,6,0.72)"; ctx.fillRect(0,0,VW,VH);
    txt("UNRAVELLED",CX,104,24,"#ff7a5a",800);
    txt("fell "+Math.floor(depth)+"m  ·  best "+Math.floor(best)+"m",CX,134,10,"#d8cdb6",600);
    if(t>0.4) txt("press SPACE / tap to fall again",CX,166,10,"#9bf0d0",700); }
  else if(mode==="win"){ ctx.fillStyle="rgba(20,14,30,0.75)"; ctx.fillRect(0,0,VW,VH);
    txt("REUNITED",CX,104,26,"#c9b0ff",800);
    txt("you fell all the way to your pair  ·  "+coinsRun+"¢",CX,134,10,"#d8cdb6",600);
    if(t>0.4) txt("press SPACE / tap to fall again",CX,166,10,"#9bf0d0",700); }

  if(BOT){ ctx.fillStyle="#0f0"; ctx.font="9px monospace"; ctx.textAlign="left";
    ctx.fillText("BOT  depth "+depth.toFixed(1)+"  hp "+hp+"  thru "+thruCount,6,VH-6); }
}

/* ===== Loop ===== */
let last=performance.now(), thumpT=0;
function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  update(dt); draw();
  if(mode==="play"){ thumpT-=dt; if(thumpT<=0){ thumpT=0.5; Snd.thump(0.08+fallV*0.04); } }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
