<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ODD SOCK — Shirt Feel-Lab</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { position:fixed; inset:0; height:100%; width:100%; background:#0d0b09; overflow:hidden; touch-action:none;
              font-family:system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#0d0b09; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<!-- DEV:BEGIN — shared dev cockpit -->
<script src="../../dev-cockpit.js"></script>
<!-- DEV:END -->
<script>
"use strict";
/* ============================================================================
   ODD SOCK — SHIRT FEEL-LAB (🔷 Mike 2026-07-24: the "chase the rabbit" playground)
   Mario-64 method — scaled down: nail the FALL/PARACHUTE feel against ONE obstacle
   before building any content. A single shirt arrives every 3s on a fixed clock
   (12 → 3 → 6 → 9, repeat) and you swing the parachuting sock to meet it.

   🔷 THE STATIC KICK PATTERN (Mike 2026-08-11) — the objective is now the opposite
   of a dodge drill: you KICK the laundry. Every kick builds STATIC, and KICKS_PER_RING
   (3) in a row is enough charge to DIVE to the next interior ring — the walls sweep
   outward past you and the shaft gets one ring tighter. Miss a shirt and the static
   drains; nothing else is lost, it is still practice.
   The dive moves the WORLD, never the player (the E3 lesson from drum.html): the sock
   holds its screen radius while the rings rush out and the next one arrives under it.

   Controls: ←→ / A D swing.   (R = reset)
   ROADMAP abilities (not here yet): PARASAIL slow-fall+inflate · STATIC-CLING PULSE shove.
   ============================================================================ */
const VW=480, VH=270, TAU=6.28318530718;
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let scale=1;
function resize(){ const w=innerWidth||1,h=innerHeight||1; scale=Math.min(w/VW,h/VH);
  const dpr=devicePixelRatio||1;
  cv.width=VW*dpr*scale|0; cv.height=VH*dpr*scale|0;
  cv.style.width=VW*scale+"px"; cv.style.height=VH*scale+"px";
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0); }
addEventListener("resize",resize); resize();

/* ===== Geometry ===== */
const CX=240, CY=135, RIM=116;
const PERSP=1.9;
const RINGS_Z=6.4, SOCK_Z=6/RINGS_Z;        // the sock rides the 6th wall ring…
const SOCK_R=Math.pow(SOCK_Z,PERSP);        // …so its radius IS that ring's radius
const HITLO=0.92, HITHI=1.05;

/* ===== Parachute-drift feel (the thing being tuned) ===== */
let   NUDGE_ACC=15.0;                  // angular accel from a held nudge
let   AV_MAX=3.2;                      // clamp on angular velocity
let   LAT_DRAG=2.4;                    // air-drag bleed → floaty settle (parachute drift)
const SWAY_SPRING=42, SWAY_DAMP=7.0;   // visual pendulum under the caught air
const CANOPY_BILLOW=0.7;               // how full the canopy reads (always open here)

/* ===== The metronome ===== */
let   SPAWN_INT=3.0;                   // one shirt every 3 seconds
const CLOCK=[-Math.PI/2, 0, Math.PI/2, Math.PI];   // 12, 3, 6, 9 o'clock (canvas angles)
const CLOCK_LABEL=["12","3","6","9"];
let   SHIRT_TRAVEL=2.55;               // seconds for a shirt to rise from deep → the sock plane (ring 1)
let   CONTACT_ARC=0.34;                // angular overlap that lands a kick (the whole target now)
let   SHUFFLE=0;                       // 0 = the fixed 12/3/6/9 clock · 1 = random lane each time

/* ===== The kick (both thrown off trajectory — that is the skill tax) ===== */
let   SOCK_KICK=3.4;                   // angular knockback to the sock (rad/s) — what stops you parking
const SOCK_RECOIL=70;                  // radial recoil "thrown off" (px/s, springs back)
const R_SPRING=44, R_DAMP=7.5;         // sock radial-offset spring
const SHIRT_SPIN=7.0, SHIRT_FLY=150;   // the shirt spins + flies off once it is punted

/* ===== STATIC → the dive (the new objective) ===== */
let   KICKS_PER_RING=3;                // kicks in a row that charge one ring's worth of static
const DIVE_T=0.55;                     // seconds the drop to the next interior ring takes
let   DEPTH_RAMP=0.94;                 // shirt rise time × this per ring — deeper = less warning
const RISE_MIN=1.10;                   // …floored here, so the ramp can never outrun a swing
function riseTime(){ return Math.max(RISE_MIN, SHIRT_TRAVEL*Math.pow(DEPTH_RAMP,depth)); }

/* ===== Audio (trimmed) ===== */
const Snd={ctx:null,g:null,
  ensure(){ if(this.ctx)return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.g=this.ctx.createGain(); this.g.gain.value=0.8; this.g.connect(this.ctx.destination);
    const n=this.ctx.sampleRate/2|0, b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=b; s.loop=true;
    const lp=this.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=90;
    const g2=this.ctx.createGain(); g2.gain.value=0.06; s.connect(lp); lp.connect(g2); g2.connect(this.g); s.start();
  }catch(e){} },
  b(f1,f2,dur,type,vol){ if(!this.ctx)return; const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.g); o.start(t); o.stop(t+dur+0.03); },
  tick(){ this.b(1200,900,0.03,"square",0.04); },              // clock tick as a shirt launches
  whoosh(){ this.b(300,700,0.12,"triangle",0.06); },
  kick(n){ this.b(150,70,0.12,"sawtooth",0.13);                // the boot: thud…
           this.b(760+n*220,1500+n*260,0.13,"triangle",0.10); },  // …then static crackling up the chain
  miss(){ this.b(260,150,0.16,"sine",0.07); },                 // it sailed past — the charge leaks away
  dive(){ this.b(760,180,0.5,"triangle",0.11); this.b(180,60,0.5,"sawtooth",0.07); }, // dropping a ring
  streak(f){ this.b(f,f*1.5,0.12,"triangle",0.09); }
};

/* ===== Sock sprite ===== */
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
let SOCK=null;
{ const W=128, r=48, c=mkCanvas(W,W), x=c.getContext("2d");
  x.translate(W/2,W/2);
  const path=()=>{ x.beginPath();
    x.moveTo(-1.05*r,-1.0*r); x.lineTo(-0.05*r,-1.0*r);
    x.lineTo(-0.05*r,0.02*r); x.quadraticCurveTo(-0.05*r,0.2*r,0.18*r,0.2*r);
    x.lineTo(0.72*r,0.2*r); x.quadraticCurveTo(1.14*r,0.24*r,1.08*r,0.64*r);
    x.lineTo(0.96*r,1.0*r); x.lineTo(-0.72*r,1.0*r);
    x.quadraticCurveTo(-1.1*r,1.0*r,-1.05*r,0.5*r); x.closePath(); };
  path(); x.fillStyle="#efe9db"; x.fill();
  x.save(); path(); x.clip();
  x.fillStyle="rgba(0,0,0,0.05)"; for(let yy=-r;yy<r;yy+=7) x.fillRect(-1.2*r,yy,2.4*r,2);
  x.fillStyle="rgba(0,0,0,0.18)";
  x.beginPath(); x.arc(-0.72*r,0.78*r,0.42*r,0,TAU); x.fill();
  x.beginPath(); x.arc(1.0*r,0.75*r,0.42*r,0,TAU); x.fill();
  x.fillStyle="rgba(255,255,255,0.45)"; x.fillRect(-1.05*r,-1.0*r,1.0*r,0.2*r);
  x.restore(); SOCK=c; }
function glowSprite(sz,r,g,b){ const c=mkCanvas(sz,sz),x=c.getContext("2d");
  const gr=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  gr.addColorStop(0,"rgba("+r+","+g+","+b+",1)"); gr.addColorStop(0.5,"rgba("+r+","+g+","+b+",0.55)");
  gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)"); x.fillStyle=gr; x.fillRect(0,0,sz,sz); return c; }
const WARM=glowSprite(128,255,190,110);

/* ===== The SHIRT (the one obstacle — a hot T-shirt) ===== */
const PAL=[{body:"#ff4a63",rim:"#ffd0d6",dark:"#7d0f1f",fold:"#c21f38"},
           {body:"#ff7a3c",rim:"#ffe0c2",dark:"#8a2c08",fold:"#d4531f"},
           {body:"#ff4a8c",rim:"#ffd0e4",dark:"#7d0f3f",fold:"#c21f5e"}];
function mkShirt(pal){ const W=72,c=mkCanvas(W,W),x=c.getContext("2d"); x.translate(W/2,W/2);
  const body=pal.body, rim=pal.rim, dark=pal.dark, fold=pal.fold;
  x.strokeStyle=dark; x.lineWidth=5; x.lineJoin="round";
  const shape=()=>{ x.beginPath();
    x.moveTo(-13,-26); x.lineTo(13,-26); x.lineTo(30,-14); x.lineTo(22,0); x.lineTo(13,-6);
    x.lineTo(13,28); x.lineTo(-13,28); x.lineTo(-13,-6); x.lineTo(-22,0); x.lineTo(-30,-14); x.closePath(); };
  shape(); x.stroke(); x.fillStyle=body; shape(); x.fill();
  x.fillStyle=dark; x.beginPath(); x.arc(0,-26,8,0,Math.PI); x.fill();
  x.fillStyle=fold; x.fillRect(-13,8,26,3); x.fillRect(-13,18,26,3);
  x.fillStyle=rim; x.fillRect(-13,25,26,3);
  return c; }
const SHIRTS=PAL.map(mkShirt);

/* ===== State ===== */
let mode="ready";                       // ready | play
let a=Math.PI/2, av=0, sway=0, swayV=0;
let rOff=0, rOffV=0;                     // sock radial recoil offset (springs back)
let t=0, spawnT=0, clockIdx=0, nextIdx=0;
let kicks=0, chain=0, bestChain=0, missed=0;
let depth=0, ringPh=0, diveT=0, stShow=0;   // depth = rings dropped · ringPh = the walls sweeping out
let shake=0, hitStop=0, flash=0, flashCol=0, drumRot=0;   // flashCol 0 = warm miss, 1 = static blue
const keys={}, touches={};
const shirts=[]; for(let i=0;i<5;i++) shirts.push({on:false,z:0,zs:0.4,ang:0,idx:0,counted:false,deflected:false,dav:0,dr:0,rot:0,pal:0,life:0});
const sparks=[]; for(let i=0;i<30;i++) sparks.push({on:false,x:0,y:0,vx:0,vy:0,life:0,col:"#fff"});
const pops=[];   for(let i=0;i<8;i++)  pops.push({on:false,x:0,y:0,txt:"",life:0,col:"#fff"});

function angDiff(x,y){ let d=(x-y)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
function spark(px,py,n,col){ for(let k=0;k<n;k++){ const s=sparks.find(q=>!q.on); if(!s)return;
  const an=Math.random()*TAU, sp=40+Math.random()*80;
  s.on=true; s.x=px; s.y=py; s.vx=Math.cos(an)*sp; s.vy=Math.sin(an)*sp; s.life=0.35+Math.random()*0.3; s.col=col; } }
function pop(px,py,txt,col){ const p=pops.find(q=>!q.on); if(!p)return; p.on=true; p.x=px; p.y=py; p.txt=txt; p.col=col; p.life=0.9; }

function reset(){ a=Math.PI/2; av=0; sway=0; swayV=0; rOff=0; rOffV=0; t=0;
  spawnT=0; clockIdx=0; nextIdx=0; kicks=0; chain=0; bestChain=0; missed=0;
  depth=0; ringPh=0; diveT=0; stShow=0; shake=0; hitStop=0; flash=0; flashCol=0;
  for(const s of shirts) s.on=false; for(const s of sparks) s.on=false; for(const p of pops) p.on=false; }

function launchShirt(){ const s=shirts.find(q=>!q.on) || shirts.find(q=>q.deflected); if(!s) return;
  s.on=true; s.z=0.05; s.ang=CLOCK[clockIdx]; s.idx=clockIdx; s.zs=1/riseTime();
  if(window.DC) DC.telegraph('shirt@'+CLOCK_LABEL[clockIdx]);   // reaction readout: the rise IS the telegraph
  s.counted=false; s.deflected=false; s.dav=0; s.dr=0; s.rot=0; s.pal=(Math.random()*SHIRTS.length)|0; s.life=0;
  clockIdx = SHUFFLE ? (Math.random()*4)|0 : (clockIdx+1)%4;
  nextIdx=clockIdx; Snd.tick(); }
function activeShirt(){ let best=null,bz=-1; for(const s of shirts){ if(s.on&&!s.deflected&&s.z>bz){best=s;bz=s.z;} } return best; }

/* ===== Input ===== */
addEventListener("keydown",e=>{ const k=e.key; keys[k]=true;
  if((k===" "||k==="Enter")&&mode!=="play"){ Snd.ensure(); reset(); mode="play"; }
  if((k==="r"||k==="R")){ Snd.ensure(); reset(); mode="play"; }
  if(k===" "||k.startsWith("Arrow")) e.preventDefault();
});
addEventListener("keyup",e=>{ keys[e.key]=false; });
function tpos(t){ const rc=cv.getBoundingClientRect(); return (t.clientX-rc.left)/rc.width; }
addEventListener("touchstart",e=>{ Snd.ensure(); if(mode!=="play"){ reset(); mode="play"; e.preventDefault(); return; }
  for(const tc of e.changedTouches) touches[tc.identifier]={x:tpos(tc)}; e.preventDefault(); },{passive:false});
addEventListener("touchmove",e=>{ for(const tc of e.changedTouches) if(touches[tc.identifier]) touches[tc.identifier].x=tpos(tc); e.preventDefault(); },{passive:false});
addEventListener("touchend",e=>{ for(const tc of e.changedTouches) delete touches[tc.identifier]; e.preventDefault(); },{passive:false});

/* ===== THE KICK — you meet the shirt, both get thrown, the static builds ===== */
function kick(sh){ let side=angDiff(a,sh.ang); if(Math.abs(side)<0.02) side=(Math.random()<0.5?-1:1)*0.02;
  const s=Math.sign(side);
  av += s*SOCK_KICK;  av=clamp(av,-AV_MAX*1.5,AV_MAX*1.5);   // the boot swings you off your lane…
  rOffV += SOCK_RECOIL;                                        // …and bounces you outward
  sh.deflected=true; sh.counted=true; sh.dav = -s*SHIRT_SPIN; sh.dr = SHIRT_FLY; sh.life=0.7;
  kicks++; chain++; bestChain=Math.max(bestChain,chain);
  hitStop=0.08; shake=8; flash=0.45; flashCol=1;
  if(window.DC) DC.input('shirt@'+CLOCK_LABEL[sh.idx], true);  // reaction readout: the swing reached it
  const zz=Math.min(1,sh.z), r=RIM*Math.pow(zz,PERSP);
  const cx=CX+Math.cos(sh.ang)*r, cy=CY+Math.sin(sh.ang)*r;
  const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R;
  spark((cx+px)/2,(cy+py)/2, 14, "#bff0ff");
  Snd.kick(Math.min(chain,KICKS_PER_RING));
  if(chain>=KICKS_PER_RING) dive();
  else pop(CX,CY-40,"KICK  "+chain+"/"+KICKS_PER_RING,"#bff0ff");
}

/* ===== MISS — it sailed past unkicked; the charge leaks away, nothing else ===== */
function miss(sh){ sh.counted=true; missed++; chain=0; flash=0.3; flashCol=0;
  if(window.DC) DC.input('shirt@'+CLOCK_LABEL[sh.idx], false);
  pop(CX+Math.cos(sh.ang)*RIM*0.72, CY+Math.sin(sh.ang)*RIM*0.72, "MISSED", "#a89e88");
  Snd.miss();
}

/* ===== THE DIVE — spend the static, drop to the next interior ring =====
   The world moves, never the player: the rings sweep outward past the sock while it
   holds its screen radius, and the next ring in arrives right under it as they land. */
function dive(){ diveT=DIVE_T; chain=0; shake=6; flash=0.6; flashCol=1;
  for(const sh of shirts){ if(!sh.on||sh.deflected) continue;   // you drop past whatever was still rising
    sh.deflected=true; sh.counted=true; sh.dav=SHIRT_SPIN*0.6; sh.dr=SHIRT_FLY*1.4; sh.life=0.6; }
  const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R;
  spark(px,py,18,"#bff0ff");
  pop(CX,CY-44,"STATIC FULL","#bff0ff"); Snd.dive();
}

/* ===== Update ===== */
function update(dt){
  t+=dt; drumRot+=0.16*dt;
  if(mode!=="play") return;
  if(hitStop>0){ hitStop-=dt; }
  else {
    // --- parachute drift ---
    let nudge=0;
    if(keys.ArrowLeft||keys.a||keys.A||keys.q||keys.Q) nudge-=1;
    if(keys.ArrowRight||keys.d||keys.D) nudge+=1;
    for(const id in touches){ const x=touches[id].x; if(x<0.5) nudge-=1; else nudge+=1; }
    av += nudge*NUDGE_ACC*dt;
    av -= av*Math.min(1,LAT_DRAG*dt);
    av = clamp(av,-AV_MAX*1.5,AV_MAX*1.5);
    a = (a+av*dt+TAU)%TAU;
    const swayTarget=-av*0.10; swayV+=((swayTarget-sway)*SWAY_SPRING - swayV*SWAY_DAMP)*dt; sway+=swayV*dt;
    // sock radial recoil spring-back
    rOffV += (-rOff*R_SPRING - rOffV*R_DAMP)*dt; rOff += rOffV*dt;

    // --- the dive: the walls sweep out one ring, then the clock starts again ---
    if(diveT>0){ diveT-=dt; ringPh=1-clamp(diveT/DIVE_T,0,1);
      if(diveT<=0){ diveT=0; ringPh=0; depth++; spawnT=SPAWN_INT;   // ring 7 wraps back to ring 6, one deeper
        pop(CX,CY,"RING "+(depth+1),"#bff0ff"); }
    } else {
      // --- metronome: one shirt every 3s on the clock, ALWAYS on the beat ---
      spawnT-=dt; if(spawnT<=0){ launchShirt(); spawnT=SPAWN_INT; }
    }

    // --- each shirt rises; kick it at the plane or lose the charge ---
    for(const sh of shirts){ if(!sh.on) continue;
      if(!sh.deflected){
        sh.z += sh.zs*dt;
        if(!sh.counted && sh.z>=HITLO && sh.z<=HITHI && diveT<=0){
          if(Math.abs(angDiff(a,sh.ang))<CONTACT_ARC){ kick(sh); }
        }
        if(!sh.counted && sh.z>HITHI) miss(sh);               // sailed past unkicked
        if(sh.z>1.35) sh.on=false;
      } else {                                                // kicked: spin + fly off, fade
        sh.life-=dt; sh.rot+=sh.dav*dt; sh.ang+=sh.dav*0.15*dt;
        sh.z += (sh.zs*0.4 + sh.dr*0.002)*dt; sh.dr*=(1-1.5*dt);
        if(sh.life<=0) sh.on=false;
      }
    }
    // static charge readout eases toward the chain it actually holds
    const target=clamp(chain/KICKS_PER_RING,0,1);
    stShow += (target-stShow)*Math.min(1,(target>stShow?14:6)*dt);
    if(chain>0 && Math.random()<dt*7){                        // charged sock crackles
      const px=CX+Math.cos(a)*RIM*SOCK_R, py=CY+Math.sin(a)*RIM*SOCK_R;
      spark(px+(Math.random()-0.5)*10,py+(Math.random()-0.5)*10,1,"#bff0ff"); }
  }
  // fx
  for(const s of sparks){ if(!s.on) continue; s.life-=dt; if(s.life<=0){s.on=false;continue;} s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=90*dt; }
  for(const p of pops){ if(!p.on) continue; p.life-=dt; p.y-=14*dt; if(p.life<=0) p.on=false; }
  if(shake>0) shake=Math.max(0,shake-dt*24);
  if(flash>0) flash=Math.max(0,flash-dt*2.4);
}

/* ===== Render ===== */
function txt(s,x,y,sz,col,w,al){ ctx.fillStyle=col||"#fff"; ctx.font=(w||600)+" "+sz+"px system-ui,sans-serif";
  ctx.textAlign=al||"center"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }

function draw(){
  const ox=(Math.random()-0.5)*shake, oy=(Math.random()-0.5)*shake;
  ctx.save(); ctx.translate(ox,oy);
  ctx.fillStyle="#100c09"; ctx.fillRect(-12,-12,VW+24,VH+24);
  ctx.imageSmoothingEnabled=false;

  // shaft wall rings (the drum you're falling down). ringPh slides them all one slot
  // outward during a dive, so the ring you land on rises to meet the sock.
  for(let ring=7;ring>=0;ring--){ const z=(ring+ringPh)/RINGS_Z; if(z>1.22) continue;
    const r=RIM*Math.pow(z,PERSP);
    const live=clamp(1-Math.abs(z-SOCK_Z)/0.10,0,1);      // the ring under the sock's feet
    const chg=live*stShow;                                 // …which glows as the static builds
    ctx.strokeStyle = live>0
      ? "rgba("+(120+71*chg)+","+(86+154*chg)+","+(54+201*chg)+","+(0.10+z*0.20+live*0.30)+")"
      : "rgba(120,86,54,"+(0.08+z*0.20)+")";
    ctx.lineWidth=1.2+z*2+live*1.4;
    ctx.beginPath(); ctx.arc(CX,CY,r,0,TAU); ctx.stroke();
    const n=10+ring*4; ctx.fillStyle="rgba("+(255-64*chg)+","+(190+50*chg)+","+(110+145*chg)+","+(0.04+z*0.09+live*0.10)+")";
    for(let k=0;k<n;k++){ const an=drumRot*(0.4+z)+k*TAU/n; ctx.fillRect(CX+Math.cos(an)*r-1,CY+Math.sin(an)*r-1,2,2); } }

  // wind streaks (the plunge read)
  { ctx.strokeStyle="rgba(210,180,255,0.06)"; ctx.lineWidth=1;
    for(let k=0;k<10;k++){ const an=(k*2.399+t*0.3)%TAU, zA=((t*0.5+k*0.137)%1);
      const r0=RIM*Math.pow(zA*0.6,PERSP), r1=RIM*Math.pow(Math.min(1,zA*0.6+0.13),PERSP);
      ctx.beginPath(); ctx.moveTo(CX+Math.cos(an)*r0,CY+Math.sin(an)*r0); ctx.lineTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1); ctx.stroke(); } }

  // CLOCK FACE on the rim — 12 / 3 / 6 / 9. The live lane is where you are HEADED now,
  // so it reads in static blue (go here), not danger red (keep away).
  const act=activeShirt();
  for(let i=0;i<4;i++){ const an=CLOCK[i], next=act?act.idx:nextIdx;
    const on=(i===next), tx=CX+Math.cos(an)*(RIM+16), ty=CY+Math.sin(an)*(RIM+16);
    ctx.strokeStyle=on?"rgba(191,240,255,0.9)":"rgba(200,150,90,0.35)"; ctx.lineWidth=on?3:2;
    ctx.beginPath(); ctx.moveTo(CX+Math.cos(an)*(RIM+4),CY+Math.sin(an)*(RIM+4));
    ctx.lineTo(CX+Math.cos(an)*(RIM+11),CY+Math.sin(an)*(RIM+11)); ctx.stroke();
    txt(CLOCK_LABEL[i],tx,ty,on?11:9, on?"#bff0ff":"rgba(200,180,150,0.55)", on?800:600);
    // aim guide from centre to the lane you want to be standing in
    if(on){ ctx.strokeStyle="rgba(191,240,255,0.14)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+Math.cos(an)*RIM,CY+Math.sin(an)*RIM); ctx.stroke();
      // the kick target: the arc your swing has to be inside when it arrives
      ctx.strokeStyle="rgba(191,240,255,0.30)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(CX,CY,RIM*SOCK_R,an-CONTACT_ARC,an+CONTACT_ARC); ctx.stroke(); } }

  // the rim
  ctx.strokeStyle="rgba(200,150,90,0.6)"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(CX,CY,RIM,0,TAU); ctx.stroke();

  // THE SHIRTS (far → near)
  ctx.imageSmoothingEnabled=true;
  for(const sh of [...shirts].filter(s=>s.on).sort((p,q)=>p.z-q.z)){
    const zz=Math.min(1,sh.z), r=RIM*Math.pow(zz,PERSP);
    const sx=CX+Math.cos(sh.ang)*r, sy=CY+Math.sin(sh.ang)*r, gs=Math.max(12,26*zz);
    const near=zz>0.8?(zz-0.8)/0.2:0;
    if(near>0 && !sh.deflected){ ctx.strokeStyle="rgba(191,240,255,"+(0.16+0.24*near)+")"; ctx.lineWidth=4+near*6;
      ctx.beginPath(); ctx.arc(CX,CY,r,sh.ang-0.28,sh.ang+0.28); ctx.stroke(); }
    ctx.globalAlpha=sh.deflected?Math.max(0,sh.life/0.7):(0.4+0.6*zz);
    ctx.save(); ctx.translate(sx,sy);
    ctx.rotate(sh.deflected?sh.rot: sh.ang+Math.PI/2+Math.sin(t*3)*0.12);
    ctx.drawImage(SHIRTS[sh.pal],-gs/2,-gs/2,gs,gs); ctx.restore();
    ctx.globalAlpha=1; }
  ctx.imageSmoothingEnabled=false;

  // THE SOCK — a hovering parachute
  { const rr=RIM*SOCK_R + rOff;
    const px=CX+Math.cos(a)*rr, py=CY+Math.sin(a)*rr;
    const billow=CANOPY_BILLOW*(0.7+0.3*Math.sin(t*7)), cs=22*(1+0.10*billow);
    ctx.globalAlpha=0.20; ctx.drawImage(WARM,px-cs,py-cs,cs*2,cs*2); ctx.globalAlpha=1;
    ctx.imageSmoothingEnabled=true; ctx.save(); ctx.translate(px,py);
    const face=Math.atan2(CY-py,CX-px)+Math.PI/2; ctx.rotate(face+sway);
    ctx.scale(1, 1+0.16*billow);
    const ss=30; ctx.drawImage(SOCK,-ss/2,-ss*0.62,ss,ss); ctx.restore(); ctx.imageSmoothingEnabled=false;
    ctx.strokeStyle="rgba(180,240,255,0.10)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,cs*0.7,0,TAU); ctx.stroke(); }

  // sparks + pops
  for(const s of sparks){ if(!s.on) continue; ctx.globalAlpha=Math.max(0,s.life*2.4); ctx.fillStyle=s.col; ctx.fillRect(s.x-1.5,s.y-1.5,3,3); } ctx.globalAlpha=1;
  for(const p of pops){ if(!p.on) continue; ctx.globalAlpha=Math.min(1,p.life*1.6); txt(p.txt,p.x,p.y,12,p.col,800); } ctx.globalAlpha=1;

  // HUD — where you are (ring), what you've done (kicks), what's next (the static bar)
  txt("KICKS",44,16,8,"rgba(255,255,255,0.5)",700,"left"); txt(""+kicks,44,32,20,"#bff0ff",800,"left");
  txt("CHAIN",VW-44,16,8,"rgba(255,255,255,0.5)",700,"right");
  txt(chain+"/"+KICKS_PER_RING,VW-44,32,20,chain>0?"#bff0ff":"#efe9db",800,"right");
  txt("RING "+(depth+1),CX,18,13,"#efe9db",800);
  txt("best chain "+bestChain+"   missed "+missed, CX, 34, 8, "rgba(220,210,190,0.55)",600);
  // the static bar — drum.html's charge language, and the only thing standing between
  // you and the next ring down
  if(mode==="play"){
    txt("STATIC",CX-84,VH-22,8,"rgba(220,210,190,0.55)",700,"right");
    ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(CX-70,VH-26,140,8);
    ctx.fillStyle=stShow>=1?"#bff0ff":stShow>0.34?"#9fd8ef":"#5b8fa8"; ctx.fillRect(CX-70,VH-26,140*stShow,8);
    for(let i=1;i<KICKS_PER_RING;i++){ ctx.fillStyle="rgba(13,11,9,0.9)"; ctx.fillRect(CX-70+140*i/KICKS_PER_RING-1,VH-26,2,8); }
    // next-shirt countdown pip
    const f=1-clamp(spawnT/SPAWN_INT,0,1);
    ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(CX-30,VH-34,60,3);
    ctx.fillStyle="#ff9a6a"; ctx.fillRect(CX-30,VH-34,60*f,3); }

  if(flash>0){ ctx.fillStyle=(flashCol?"rgba(150,225,255,":"rgba(255,150,90,")+(flash*0.35)+")"; ctx.fillRect(-12,-12,VW+24,VH+24); }
  ctx.restore();

  if(mode==="ready"){ ctx.fillStyle="rgba(10,8,6,0.74)"; ctx.fillRect(0,0,VW,VH);
    txt("SHIRT FEEL-LAB",CX,64,24,"#efe9db",800);
    txt("the STATIC KICK pattern",CX,86,10,"#bff0ff",700);
    txt("A shirt every 3s on the clock: 12 → 3 → 6 → 9",CX,110,10,"#d8cdb6",500);
    txt("swing the parachuting sock INTO it — every kick builds static",CX,126,10,"#d8cdb6",500);
    txt(KICKS_PER_RING+" kicks in a row drops you to the next interior ring",CX,142,10,"#bff0ff",600);
    txt("let one sail past and the static drains — no harm, just practice",CX,158,9,"#a89e88",500);
    txt("←→  swing",CX,182,11,"#9bf0d0",700);
    txt("press SPACE / tap to begin",CX,204,10,"#c9b0ff",700); }
}

/* ===== Loop ===== */
// dt comes from the rAF timestamp, not performance.now(), so the dev cockpit's
// freeze / frame-step / slow-motion apply to this lab for free.
let last=0;
function frame(now){ if(!last){ last=now; requestAnimationFrame(frame); return; }
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; update(dt); draw(); requestAnimationFrame(frame); }

/* DEV:BEGIN — dev cockpit for the shirt feel-lab ==============================
   A feel-lab without instrumentation is just a small game (BUILD_PILLARS "A").
   The shirt's rise time IS the telegraph here, so the reaction readout is the
   control that matters: it says how many frames you actually took to swing onto
   the lane, and whether the swing got there before the shirt did.
   ========================================================================= */
const DC = DevCockpit.mount({
  game: 'odd-sock-shirt-lab',
  knobs: [
    { key:'nudge',  label:'swing accel',        min:4,   max:40,  step:0.5,  get:()=>NUDGE_ACC,   set:v=>NUDGE_ACC=v },
    { key:'avmax',  label:'max swing speed',    min:1,   max:8,   step:0.1,  get:()=>AV_MAX,      set:v=>AV_MAX=v },
    { key:'drag',   label:'air drag',           min:0.4, max:8,   step:0.1,  get:()=>LAT_DRAG,    set:v=>LAT_DRAG=v },
    { key:'travel', label:'shirt rise (s)',     min:0.8, max:5,   step:0.05, get:()=>SHIRT_TRAVEL,set:v=>SHIRT_TRAVEL=v },
    { key:'spawn',  label:'seconds per shirt',  min:0.8, max:6,   step:0.1,  get:()=>SPAWN_INT,   set:v=>SPAWN_INT=v },
    { key:'karc',   label:'kick arc',           min:0.1, max:1.2, step:0.02, get:()=>CONTACT_ARC, set:v=>CONTACT_ARC=v },
    { key:'kknock', label:'kick knockback',     min:0,   max:7,   step:0.1,  get:()=>SOCK_KICK,   set:v=>SOCK_KICK=v },
    { key:'perring',label:'kicks per ring',     min:1,   max:8,   step:1,    get:()=>KICKS_PER_RING, set:v=>KICKS_PER_RING=v },
    { key:'ramp',   label:'depth ramp (×/ring)',min:0.8, max:1,   step:0.01, get:()=>DEPTH_RAMP,  set:v=>DEPTH_RAMP=v },
  ],
  actions: [
    { label:'send a shirt to 12', run:()=>devShirt(0) },
    { label:'send a shirt to 3',  run:()=>devShirt(1) },
    { label:'send a shirt to 6',  run:()=>devShirt(2) },
    { label:'send a shirt to 9',  run:()=>devShirt(3) },
    { label:'dive a ring now',    run:()=>{ if(diveT<=0) dive(); } },
    { label:'lane order: clock / shuffle', run:()=>{ SHUFFLE=SHUFFLE?0:1; } },
    { label:'clear the air',      run:()=>{ for(const sh of shirts) sh.on=false; } },
  ],
  reset: ()=>{ reset(); mode='play'; },
});
window.DC = DC;
window.devShirt = (idx)=>{
  const sh = shirts.find(x=>!x.on); if(!sh) return;
  sh.on=true; sh.z=0; sh.idx=idx; sh.ang=CLOCK[idx]; sh.zs=1/riseTime(); sh.counted=false; sh.deflected=false;
  sh.dav=0; sh.dr=0; sh.rot=0; sh.pal=idx%PAL.length; sh.life=0;
  DC.telegraph('shirt@'+CLOCK_LABEL[idx]);
};
/* DEV:END ================================================================= */

requestAnimationFrame(frame);
</script>
